name: Update publications

# Refreshes data/publications.json from Semantic Scholar so the research
# page's citation counts stay current without a server. Commits only when
# the data actually changed.

on:
  schedule:
    - cron: "17 4 * * 1"   # Mondays, 04:17 UTC
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch publications
        run: python scripts/fetch_publications.py

      - name: Commit if changed
        run: |
          if git diff --quiet -- data/publications.json; then
            echo "No change."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/publications.json
          git commit -m "Update publication data"
          git push
